<style>

.lk{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 6px}.lk a{font-size:13px;color:var(--fg);text-decoration:none;border:1px solid #DCD3C2;background:#FDFCF8;border-radius:999px;padding:7px 14px}.lk span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);align-self:center;margin-right:4px}

.p{cursor:zoom-in}

#zv{position:fixed;inset:0;z-index:9;background:rgba(243,240,233,.98);display:none;align-items:center;justify-content:center;cursor:zoom-out}
#zv.on{display:flex}#zv img{max-width:96vw;max-height:94vh;box-shadow:0 10px 40px -20px rgba(16,16,16,.5);pointer-events:none}
